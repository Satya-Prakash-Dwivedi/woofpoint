			shellScript = "# Type a script or drag a script file from your workspace to insert its path.echo \"🔧 Ensuring Hermes dSYM generation...\"\n\n# Define paths\nPODS_ROOT=\"${SRCROOT}/Pods\"\nHERMES_PATH=\"${PODS_ROOT}/hermes-engine\"\nDSYM_FOLDER=\"${DWARF_DSYM_FOLDER_PATH}\"\n\n# Find Hermes framework in different possible locations\nHERMES_LOCATIONS=(\n    \"${BUILT_PRODUCTS_DIR}/hermes.framework/hermes\"\n    \"${PODS_CONFIGURATION_BUILD_DIR}/hermes-engine/hermes.framework/hermes\"\n    \"${HERMES_PATH}/destroot/Library/Frameworks/universal/hermes.xcframework/ios-arm64/hermes.framework/hermes\"\n    \"${HERMES_PATH}/destroot/Library/Frameworks/universal/hermes.xcframework/ios-arm64-simulator/hermes.framework/hermes\"\n)\n\nfor HERMES_BINARY in \"${HERMES_LOCATIONS[@]}\"; do\n    if [ -f \"${HERMES_BINARY}\" ]; then\n        echo \"✅ Found Hermes at: ${HERMES_BINARY}\"\n        echo \"📦 Generating dSYM...\"\n        \n        dsymutil \"${HERMES_BINARY}\" -o \"${DSYM_FOLDER}/hermes.framework.dSYM\"\n        \n        if [ -d \"${DSYM_FOLDER}/hermes.framework.dSYM\" ]; then\n            echo \"✅ Successfully generated Hermes dSYM\"\n            # Verify the UUID\n            echo \"UUID verification:\"\n            dwarfdump -u \"${DSYM_FOLDER}/hermes.framework.dSYM\"\n        fi\n        break\n    fi\ndone\n\necho \"📋 Contents of dSYM folder:\"\nls -la \"${DSYM_FOLDER}\"\n";
		};
